openapi: 3.0.0
info:
  title: URL Parameter Test API
  version: 1.0.0
paths:
  # Endpoint 1: NO VARIABLES. Should stay exactly "/products"
  /products:
    get:
      summary: Get all products
      responses:
        '200':
          description: A list of products

  # Endpoint 2: HAS VARIABLE. Should replace "{product_id}" with an integer
  /products/{product_id}:
    get:
      summary: Get a product by ID
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Product details